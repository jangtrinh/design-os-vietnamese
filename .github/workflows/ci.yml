name: DESIGN:OS Vietnamese CI & UKMC Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Self-Check, UKMC.v1 Audit & Regression Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run 7-Step Self-Check Gate
        run: python3 scripts/self_check.py

      - name: Run UKMC.v1 Knowledge Audit Gate
        run: python3 tools/verify_ukmc.py

      - name: Run Full Unit & Golden Benchmark Test Suite
        run: python3 -m unittest discover -s tests -v
