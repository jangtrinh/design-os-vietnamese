[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "design-os-vietnamese"
version = "5.1.0"
description = "Deterministic Vietnamese (vi-VN) Language, UX Microcopy, Typography & Regulatory Compliance Suite for AI Agents & CI/CD"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Jang Trinh" }
]
keywords = [
    "vietnamese",
    "vi-vn",
    "i18n",
    "l10n",
    "ux-writing",
    "linter",
    "ai-skills",
    "design-system",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Vietnamese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://jangtrinh.github.io/design-os-vietnamese/"
Repository = "https://github.com/jangtrinh/design-os-vietnamese"
Issues = "https://github.com/jangtrinh/design-os-vietnamese/issues"
Changelog = "https://github.com/jangtrinh/design-os-vietnamese/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = []
